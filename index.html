<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>逆傘クラッシャー：横持ち版</title>
<style>
:root { --night:#171b26; --road:#303849; --mint:#5eead4; --yellow:#fbbf24; --red:#fb7185; --ink:#f4f1e9; --muted:#a3adc3; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; background:#10131a; overflow:hidden; touch-action:none; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--ink); }
#stage { position:fixed; inset:0; max-width:560px; margin:auto; overflow:hidden; background:var(--night); }
canvas { width:100%; height:100%; display:block; touch-action:none; }
#hud { position:absolute; z-index:2; left:14px; right:14px; top:max(14px,env(safe-area-inset-top)); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:none; }
.stat { display:flex; flex-direction:column; gap:2px; min-width:70px; }
.stat:nth-child(2) { align-items:center; } .stat:nth-child(3) { align-items:flex-end; }
.stat .k { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.18em; }
.stat .v { font:800 23px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; }
#combo {color:var(--yellow)} #clock {color:var(--mint)}
#modeBadge { position:absolute; z-index:2; top:67px; left:14px; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--mint); pointer-events:none; }
#controls { position:absolute; z-index:3; left:12px; right:12px; bottom:max(15px,env(safe-area-inset-bottom)); display:none; justify-content:space-between; gap:7px; }
.tiny { flex:1; border:1px solid #526173; background:#202a37ed; color:#d6e5e6; font-size:12px; padding:12px 4px; border-radius:50px; touch-action:manipulation; }
.tiny.active { background:#23524f; border-color:var(--mint); }
.overlay { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:radial-gradient(ellipse at 50% 6%,#283548 0%,#171b26 72%); }
.panel { width:min(100%,385px); }
.eyebrow { font-size:11px; color:var(--mint); font-weight:900; letter-spacing:.24em; }
h1 { font-size:clamp(31px,8vw,43px); line-height:1.17; letter-spacing:-.045em; margin:11px 0 17px; font-weight:900; }
h1 em {font-style:normal;color:var(--red)}
.intro { color:#c4ccda; font-size:14px; line-height:1.9; margin:0 auto 20px; max-width:320px; }
.diagram { background:#252f3d; border:1px solid #3e5361; border-radius:18px; padding:13px 8px 11px; margin:14px auto 22px; }
.diagram svg { width:100%; max-height:140px; overflow:visible; }
.diagram p {margin:3px 0 0; font-size:11px; color:#a8c7cb; }
.cta { width:100%; background:var(--mint); color:#12212a; font:900 16px inherit; border:0; border-radius:999px; padding:15px; margin:6px auto; cursor:pointer; box-shadow:0 8px 25px #5eead42b; font-weight:900; font-size:16px; }
.alt { background:#303c50; color:var(--ink); border:1px solid #5b7284; box-shadow:none; }
.note {color:#95a4b8;font-size:12px;line-height:1.7;margin-top:14px;}
#end { display:none; } .scoreBig {font:900 60px ui-monospace,Menlo,monospace; margin:5px 0;letter-spacing:-.07em;} #best {color:var(--yellow);font-size:14px;font-weight:800;margin:9px 0 25px;}
@media (max-height:620px){ .diagram{margin:8px auto} .diagram svg{max-height:80px} .intro{line-height:1.5;margin-bottom:8px} h1{margin:6px 0} .note{margin-top:7px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="傘を振る歩行者をタップするゲーム"></canvas>
  <div id="hud" aria-live="off"><div class="stat"><span class="k">SCORE</span><span class="v" id="score">0</span></div><div class="stat"><span class="k">COMBO</span><span class="v" id="combo">0</span></div><div class="stat"><span class="k">TIME</span><span class="v" id="clock">60</span></div></div>
  <div id="modeBadge"></div>
  <div id="controls"><button id="arcBtn" class="tiny active">軌道 ON</button><button id="slowBtn" class="tiny">1/2 スロー</button><button id="soundBtn" class="tiny active" aria-pressed="true">音 ON</button><button id="exitBtn" class="tiny">戻る</button></div>
  <div id="start" class="overlay"><div class="panel">
    <div class="eyebrow">THE SIDEWAYS UMBRELLA EDITION</div><h1>逆傘<em>クラッシャー</em></h1>
    <p class="intro">太ももの横で、傘の柄の近くをわしづかみ。<br>後方に長く突き出た傘が、肩からの大きな腕振りと脚の歩調に合わせて前後へ。危険な瞬間に傘の真ん中をタップ！</p>
    <div class="diagram">
      <svg viewBox="0 0 320 126" role="img" aria-label="後ろに長く突き出した傘を、柄のすぐ手前で握って歩く図">
        <path d="M240 10 V71" stroke="#b4bfce" stroke-width="10" stroke-linecap="round"/>
        <path d="M245 24 L267 50 L245 65" stroke="#b4bfce" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        <path d="M267 50 L228 76" stroke="#ead6c3" stroke-width="8" stroke-linecap="round"/>
        <path d="M228 76 L60 94" stroke="#bfc8cf" stroke-width="5" stroke-linecap="round"/>
        <path d="M63 92 L89 82 L185 73 L190 81 L89 102 Z" fill="#c3d24f" opacity=".88"/>
        <path d="M228 76 L272 70" stroke="#bfc8cf" stroke-width="5" stroke-linecap="round"/>
        <path d="M272 70 C295 65 301 81 287 94" stroke="#333e51" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="228" cy="76" r="7" fill="#f1d2b9" stroke="#171b26" stroke-width="2"/>
        <path d="M62 94 Q49 58 76 44" stroke="#5eead4" stroke-dasharray="4 4" stroke-width="2" fill="none"/>
        <path d="M62 94 Q53 116 88 117" stroke="#5eead4" stroke-dasharray="4 4" stroke-width="2" fill="none"/>
        <text x="7" y="27" font-size="12" font-weight="800" fill="#c3d24f">先端 ←</text>
        <text x="177" y="50" font-size="11" font-weight="800" fill="#5eead4">握り位置 ↓</text>
        <text x="269" y="55" font-size="10" fill="#a3adc3">柄</text>
      </svg><p>先端は体の後ろ。柄は手より前。握った位置を軸に傘全体が揺れる。</p>
    </div>
    <button id="demoBtn" class="cta">まず動きを見る（時間無制限）</button>
    <button id="playBtn" class="cta alt">60秒ゲームで遊ぶ</button><button id="homeSoundBtn" class="cta alt" style="padding:10px;font-size:13px;margin-top:5px">効果音 ON</button>
    <div class="note">採用した腕・傘・脚の同期モーションを本体へ移植済み。<br>まず動きを確認し、その後60秒ゲームで「！」の出た傘の中ほどをタップ。</div>
  </div></div>
  <div id="end" class="overlay"><div class="panel"><div class="eyebrow">TIME UP</div><h1>踏みつけ終了</h1><p class="note">FINAL SCORE</p><div class="scoreBig" id="finalScore">0</div><div id="best">BEST 0</div><button id="againBtn" class="cta">もう一度</button><button id="backBtn" class="cta alt">タイトルへ</button></div></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,ground=0,last=0,mode='idle',elapsed=0,remaining=60,spawnIn=0,score=0,combo=0,best=0,guide=true,slow=false,raf=0,shake=0;
let walkers=[],effects=[],texts=[],stomps=[];
const PI=Math.PI,TAU=2*PI;
const MOTION_KEYS=[
 {arm:-0.82,bend:-.035,umb:1.12,step:-1.12},
 {arm:-0.49,bend:.015,umb:.88,step:-.52},
 {arm:-0.06,bend:.105,umb:.49,step:0.00},
 {arm:.44,bend:.090,umb:.025,step:.44},
 {arm:.79,bend:.055,umb:-.20,step:.88}
];
const SCENE_SCALE=.72; // pulled-back framing: roughly five sideways umbrellas fit across the screen
const BODY={shoulderX:9, shoulderY:202, hipY:95, headY:36, upperArm:52, foreArm:49, backLen:145, frontLen:28, legStride:25};
const rand=(min,max)=>min+Math.random()*(max-min);
// Optional sound module: synthesized in-browser. Never blocks gameplay if unavailable.
// Browser audio starts only after a user click/tap, as required on mobile.
let soundEnabled=true, audioCtx=null, noiseBuffer=null, lastWarnSecond=11;
const soundEvents=[]; // read by opt-in regression tests, not exposed during regular play
function soundStatus(){
 const gameBtn=$('soundBtn'),homeBtn=$('homeSoundBtn');
 gameBtn.textContent=soundEnabled?'音 ON':'音 OFF';gameBtn.classList.toggle('active',soundEnabled);
 gameBtn.setAttribute('aria-pressed',String(soundEnabled));
 homeBtn.textContent=soundEnabled?'効果音 ON':'効果音 OFF';homeBtn.classList.toggle('active',soundEnabled);
 homeBtn.setAttribute('aria-pressed',String(soundEnabled));
}
function unlockAudio(){
 if(!soundEnabled)return;
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return;
  if(!audioCtx)audioCtx=new AudioCtor();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 }catch(_){audioCtx=null;}
}
function setSound(on){soundEnabled=!!on;soundStatus();if(soundEnabled)unlockAudio();}
function soundTone(at,freq,endFreq,duration,volume,type='triangle'){
 const c=audioCtx,osc=c.createOscillator(),gain=c.createGain();
 osc.type=type;osc.frequency.setValueAtTime(Math.max(20,freq),at);
 osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),at+duration);
 gain.gain.setValueAtTime(.0001,at);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),at+.008);
 gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(gain);gain.connect(c.destination);osc.start(at);osc.stop(at+duration+.012);
}
function soundNoise(at,duration,volume,filterHz){
 const c=audioCtx;
 if(!noiseBuffer){
  noiseBuffer=c.createBuffer(1,Math.round(c.sampleRate*.40),c.sampleRate);
  const data=noiseBuffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 }
 const source=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();
 source.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=filterHz;filter.Q.value=.75;
 gain.gain.setValueAtTime(.0001,at);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),at+.004);
 gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
 source.connect(filter);filter.connect(gain);gain.connect(c.destination);
 source.start(at);source.stop(at+duration+.012);
}
function playSound(kind){
 if(!soundEnabled)return;
 soundEvents.push(kind);if(soundEvents.length>100)soundEvents.shift();
 if(!audioCtx||audioCtx.state!=='running')return;
 try{
  const c=audioCtx,n=c.currentTime+.004;
  if(kind==='crack'){
   soundTone(n,175,65,.13,.13,'triangle'); // firm heel impact
   soundNoise(n+.025,.095,.19,1850);     // dry umbrella snap
   soundNoise(n+.057,.065,.11,3400);     // small secondary crack
  }else if(kind==='miss')soundTone(n,230,120,.095,.045,'sine');
  else if(kind==='combo'){
   soundTone(n,660,840,.085,.057,'sine');soundTone(n+.092,880,1180,.12,.07,'sine');
  }else if(kind==='warning')soundTone(n,720,540,.09,.035,'triangle');
  else if(kind==='end'){
   soundTone(n,520,390,.17,.065,'triangle');soundTone(n+.17,370,190,.30,.072,'triangle');
  }
 }catch(_){/* Sound errors should never break scoring or animation. */}
}

function resize(){const r=stage.getBoundingClientRect(); W=r.width;H=r.height;DPR=Math.min(devicePixelRatio||1,2.5);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ground=H*.79;}
window.addEventListener('resize',resize);resize();
function hud(){ $('score').textContent=score;$('combo').textContent=combo;$('clock').textContent=mode==='demo'?'∞':Math.max(0,Math.ceil(remaining)); }
function makeWalker(x,dir){
 const p=Math.min(elapsed/60,1);
 return {
  x:x??(dir===1?-145:W+145),dir,vx:rand(55,69)+p*18,
  phase:rand(0,TAU),omega:rand(2.45,2.85)+p*.22,
  alive:true,broken:false,stumble:0,stumbleIn:rand(3.8,7.2),
  respawnIn:0,tipSpeed:0,prevTip:null,trail:[],color:Math.random()<.5?'#d2dfeb':'#e8dad2'
 };
}
function pose(w,phase=w.phase){
 const cyc=(1-Math.cos(phase))*0.5; // 0..1..0, matching the approved arm demo
 const f=Math.min(3.999999,Math.max(0,cyc)*4);
 const i=Math.floor(f),u=(f-i)*(f-i)*(3-2*(f-i));
 const a=MOTION_KEYS[i],b=MOTION_KEYS[i+1]||MOTION_KEYS[i];
 const arm=randLerp(a.arm,b.arm,u),bend=randLerp(a.bend,b.bend,u),umb=randLerp(a.umb,b.umb,u),step=randLerp(a.step,b.step,u);
 const s=SCENE_SCALE;
 const torsoX=w.x, shoulderY=ground-BODY.shoulderY*s, hipY=ground-BODY.hipY*s, headY=shoulderY-BODY.headY*s;
 const shoulderX=torsoX-w.dir*(BODY.shoulderX*s);
 const elbowX=shoulderX-w.dir*((BODY.upperArm*s)*Math.sin(arm)), elbowY=shoulderY+(BODY.upperArm*s)*Math.cos(arm);
 const handX=elbowX-w.dir*((BODY.foreArm*s)*Math.sin(arm+bend)), handY=elbowY+(BODY.foreArm*s)*Math.cos(arm+bend);
 const tipX=handX-w.dir*((BODY.backLen*s)*Math.cos(umb)), tipY=handY+(BODY.backLen*s)*Math.sin(umb);
 const handleX=handX+w.dir*((BODY.frontLen*s)*Math.cos(umb)), handleY=handY-(BODY.frontLen*s)*Math.sin(umb);
 const targetT=.56;
 const targetX=handX+(tipX-handX)*targetT, targetY=handY+(tipY-handY)*targetT;
 return {cyc,arm,bend,umb,step,torsoX,shoulderX,shoulderY,hipY,headY,elbowX,elbowY,handX,handY,tipX,tipY,handleX,handleY,targetX,targetY,
  glow:cyc>.72&&!w.broken};
}
function randLerp(a,b,t){return a+(b-a)*t;}
// Pure leg geometry shared by the renderer and regression tests. Do not change the
// approved ① / ⑤ relationship without updating the reviewed motion fixture.
function legEndpoints(p,x,dir,groundY=ground){
 const stride=p.step*BODY.legStride;
 return {
  farHipX:x+9*SCENE_SCALE, farFootX:x-dir*(24+stride)*SCENE_SCALE,
  nearHipX:x+3*SCENE_SCALE, nearFootX:x-dir*(-13-stride)*SCENE_SCALE,
  hipY:p.hipY, footY:groundY-6
 };
}

function strokeSeg(ax,ay,bx,by,col,w=3){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
function fillDot(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function particles(x,y,color,n=14){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(55,170);effects.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-55,life:rand(.35,.75),max:.75,color,size:rand(2,4.5)});}}
function popup(x,y,label,color){texts.push({x,y,label,color,life:.8});}
function seed(chosen){
 if(chosen==='demo'){
  const w=makeWalker(W*.66,1);w.phase=0;w.vx=0;w.stumbleIn=999;
  walkers=[w];
 } else {
  const w=makeWalker(W*.60,1);w.phase=0;
  walkers=[w];
 }
}
function reset(chosen){
 cancelAnimationFrame(raf);mode=chosen;elapsed=0;remaining=60;spawnIn=1250;
 score=0;combo=0;walkers=[];effects=[];texts=[];stomps=[];shake=0;lastWarnSecond=11;
 guide=chosen==='demo';slow=false;
 $('arcBtn').classList.toggle('active',guide);$('arcBtn').textContent=guide?'軌道 ON':'軌道 OFF';
 $('slowBtn').classList.remove('active');$('slowBtn').textContent='1/2 スロー';
 $('start').style.display='none';$('end').style.display='none';$('controls').style.display='flex';
 $('modeBadge').textContent=chosen==='demo'?'動作確認｜画面を引いた状態で3人前後を表示':'';
 seed(chosen);hud();last=performance.now();raf=requestAnimationFrame(loop);
}
function quit(){cancelAnimationFrame(raf);mode='idle';$('start').style.display='flex';$('end').style.display='none';$('controls').style.display='none';$('modeBadge').textContent='';}
function finish(){playSound('end');mode='over';best=Math.max(score,best);$('finalScore').textContent=score;$('best').textContent='BEST '+best;$('end').style.display='flex';$('controls').style.display='none';}
$('demoBtn').onclick=()=>{unlockAudio();reset('demo');};$('playBtn').onclick=()=>{unlockAudio();reset('play');};$('againBtn').onclick=()=>{unlockAudio();reset('play');};$('backBtn').onclick=quit;$('exitBtn').onclick=quit;
$('arcBtn').onclick=()=>{guide=!guide;$('arcBtn').classList.toggle('active',guide);$('arcBtn').textContent=guide?'軌道 ON':'軌道 OFF';};
$('soundBtn').onclick=()=>setSound(!soundEnabled);$('homeSoundBtn').onclick=()=>setSound(!soundEnabled);
$('slowBtn').onclick=()=>{slow=!slow;$('slowBtn').classList.toggle('active',slow);$('slowBtn').textContent=slow?'通常速度':'1/2 スロー';};
function tap(x,y){if(mode!=='demo'&&mode!=='play')return;let nearest=null,dist=44*SCENE_SCALE+18;
 for(const w of walkers){if(!w.alive||w.broken)continue;const p=pose(w),d=Math.hypot(x-p.targetX,y-p.targetY);if(d<dist){nearest={w,p};dist=d;}}
 if(!nearest){if(mode==='play'){combo=0;playSound('miss');hud();}return;}
 const {w,p}=nearest;
 if(p.glow){w.broken=true;w.respawnIn=1.15;combo++;const points=100*(1+Math.floor((combo-1)/5));score+=points;stomps.push({x:p.targetX,y:p.targetY,age:0,hit:false});w.trail=[];playSound('crack');if(combo%5===0)playSound('combo');hud();}
 else{if(mode==='play')combo=0;playSound('miss');hud();popup(p.targetX,p.targetY,'まだ！','#fb7185');particles(p.targetX,p.targetY,'#fb7185',5);}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();const r=canvas.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);},{passive:false});
function update(dt){
 elapsed+=dt;
 if(mode==='play'){
  remaining-=dt;
  const warnSecond=Math.ceil(remaining);
  if(remaining>0&&warnSecond<=10&&warnSecond>=1&&warnSecond<lastWarnSecond){playSound('warning');lastWarnSecond=warnSecond;}
  if(remaining<=0){remaining=0;hud();finish();return;}
  spawnIn-=dt*1000;
  if(spawnIn<=0){
   const alive=walkers.filter(w=>w.alive&&!w.broken).length,cap=3;
   if(alive<cap){
    const dir=Math.random()<.5?1:-1,x=dir===1?-130:W+130;
    if(!walkers.some(w=>w.alive&&w.dir===dir&&Math.abs(w.x-x)<112))walkers.push(makeWalker(x,dir));
    spawnIn=(980-Math.min(elapsed/60,1)*180)*rand(.82,1.10);
   } else spawnIn=120;
  }
 }
 for(const w of walkers){
  if(w.broken){
   if(mode==='demo'){
    w.respawnIn-=dt;
    if(w.respawnIn<=0){w.broken=false;w.phase=0;w.trail=[];}
   } else w.x+=w.vx*w.dir*dt;
   continue;
  }
  if(mode==='demo'){
   // Walk on a moving sidewalk so the same person stays visible all the time.
   w.x=W*.66+Math.sin(elapsed*.34)*12;
   w.phase+=w.omega*dt;
  }else if(w.stumble>0){w.stumble-=dt;w.phase+=w.omega*dt*1.12;}
  else{
   w.x+=w.vx*w.dir*dt;w.phase+=w.omega*dt;
   w.stumbleIn-=dt;
   if(w.stumbleIn<0){w.stumble=rand(.18,.31);w.stumbleIn=rand(4,7);}
  }
  const p=pose(w);
  if(w.prevTip)w.tipSpeed=Math.hypot(p.tipX-w.prevTip.x,p.tipY-w.prevTip.y)/Math.max(dt,1/240);
  w.prevTip={x:p.tipX,y:p.tipY};w.trail.push({x:p.tipX,y:p.tipY});
  if(w.trail.length>10)w.trail.shift();
 }
 if(mode==='play'){
  for(const w of walkers)if(w.x<-170||w.x>W+170)w.alive=false;
  walkers=walkers.filter(w=>w.alive);
 }
 for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=300*dt;e.life-=dt;if(e.life<=0)effects.splice(i,1);}
 for(let i=texts.length-1;i>=0;i--){const e=texts[i];e.y-=40*dt;e.life-=dt;if(e.life<=0)texts.splice(i,1);}
 for(let i=stomps.length-1;i>=0;i--){const e=stomps[i];e.age+=dt;if(!e.hit&&e.age>=.13){e.hit=true;particles(e.x,e.y,'#5eead4',17);popup(e.x,e.y,'バキッ！','#fbbf24');shake=.15;}if(e.age>.44)stomps.splice(i,1);}
 shake=Math.max(0,shake-dt);hud();
}
function background(t){const sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#171b26');sky.addColorStop(1,'#293649');ctx.fillStyle=sky;ctx.fillRect(-18,-18,W+36,ground+18);
 ctx.fillStyle='#3b4555';ctx.fillRect(-18,ground,W+36,H-ground+18);ctx.fillStyle='#202936';ctx.fillRect(-18,ground+30,W+36,H-ground);
 ctx.strokeStyle='#5eead43f';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-18,ground+.5);ctx.lineTo(W+18,ground+.5);ctx.stroke();
 for(let i=0;i<7;i++){let x=((i*119-t*13)%(W+119)+(W+119))%(W+119)-50;ctx.fillStyle='#36485a';ctx.fillRect(x,ground-165,47,164);ctx.fillStyle='#54707a22';for(let j=0;j<4;j++)ctx.fillRect(x+8,ground-149+j*34,11,17);}
 ctx.strokeStyle='#bdd0df13';for(let i=0;i<16;i++){let x=((i*93+t*29)%(W+18));ctx.beginPath();ctx.moveTo(x,ground+52+(i%4)*24);ctx.lineTo(x+16,ground+52+(i%4)*24);ctx.stroke();}
 ctx.fillStyle='#141d29';ctx.fillRect(-18,ground+4,W+36,3);}
function drawWalker(w,t){
 const p=pose(w),x=p.torsoX,dir=w.dir;
 ctx.save();ctx.globalAlpha=.30;ctx.fillStyle='#04070b';ctx.beginPath();ctx.ellipse(x+dir*3,ground+4,21,5,0,0,TAU);ctx.fill();ctx.restore();
 if(guide&&!w.broken){
  ctx.save();
  ctx.setLineDash([3,5]);
  ctx.strokeStyle='#5eead4d1';ctx.lineWidth=1.45;ctx.beginPath();
  for(let i=0;i<=120;i++){const q=pose(w,TAU*i/120);if(i===0)ctx.moveTo(q.tipX,q.tipY);else ctx.lineTo(q.tipX,q.tipY);} ctx.stroke();
  ctx.strokeStyle='#ffb76acc';ctx.beginPath();
  for(let i=0;i<=120;i++){const q=pose(w,TAU*i/120);if(i===0)ctx.moveTo(q.handX,q.handY);else ctx.lineTo(q.handX,q.handY);} ctx.stroke();
  ctx.setLineDash([]);
  fillDot(p.handX,p.handY,3.8,'#5eead4');
  ctx.restore();
 }
 const legs=legEndpoints(p,x,dir);
 // far leg dark, near leg light; exact coordinates frozen in tests/fixtures/motion_v1.json
 strokeSeg(legs.farHipX,legs.hipY,legs.farFootX,legs.footY,'#68717c',6.3);
 strokeSeg(legs.nearHipX,legs.hipY,legs.nearFootX,legs.footY,'#e1e4e8',6.3);
 // torso
 ctx.fillStyle='#2d4659';ctx.strokeStyle=w.color;ctx.lineWidth=2.3;
 ctx.beginPath();ctx.roundRect(x-13,p.shoulderY+4,24,p.hipY-(p.shoulderY+4),5);ctx.fill();ctx.stroke();
 // head + hair + nose, mirrored by direction of travel
 ctx.fillStyle='#ead6c3';ctx.strokeStyle=w.color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+dir*2,p.headY,9.5,0,TAU);ctx.fill();ctx.stroke();
 ctx.fillStyle='#29313b';ctx.beginPath();
 if(dir===-1){ctx.arc(x+1,p.headY-4,9.5,Math.PI,TAU);ctx.lineTo(x+10,p.headY-4);}else{ctx.arc(x-1,p.headY-4,9.5,0,Math.PI);ctx.lineTo(x-10,p.headY-4);}ctx.fill();
 ctx.strokeStyle=w.color;ctx.beginPath();ctx.moveTo(x+dir*9,p.headY-1.5);ctx.lineTo(x+dir*13,p.headY+1.5);ctx.stroke();
 // free arm at the front side, counter-swinging
 const other=-p.arm*.66,frontShoulderX=x+dir*8,frontShoulderY=p.shoulderY+16;
 const freeElbowX=frontShoulderX-dir*(29*Math.sin(other)), freeElbowY=frontShoulderY+29*Math.cos(other);
 const freeHandX=freeElbowX-dir*(19*Math.sin(other+.11)), freeHandY=freeElbowY+19*Math.cos(other+.11);
 strokeSeg(frontShoulderX,frontShoulderY,freeElbowX,freeElbowY,'#9aadc0',4.6);
 strokeSeg(freeElbowX,freeElbowY,freeHandX,freeHandY,'#9aadc0',4.6);
 // umbrella arm prominently attached to shoulder -> elbow -> hand
 strokeSeg(p.shoulderX,p.shoulderY,p.elbowX,p.elbowY,'#72f3df',7.5);
 strokeSeg(p.elbowX,p.elbowY,p.handX,p.handY,'#72f3df',6.9);
 fillDot(p.shoulderX,p.shoulderY,5.2,'#e6f5f1');
 fillDot(p.elbowX,p.elbowY,3.8,'#3f9d94');
 if(!w.broken){
  if(w.trail.length){ctx.save();for(let i=0;i<w.trail.length;i++){const a=w.trail[i];ctx.globalAlpha=.04+.18*i/w.trail.length;ctx.fillStyle='#c3d24f';ctx.beginPath();ctx.arc(a.x,a.y,1.7,0,TAU);ctx.fill();}ctx.restore();}
  // shaft runs through the grip: hook is forward, dangerous tip is rear
  strokeSeg(p.handleX,p.handleY,p.tipX,p.tipY,'#d8e2e5',3);
  const dx=p.tipX-p.handX,dy=p.tipY-p.handY,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
  const at=(f,n)=>[p.handX+dx*f+nx*n,p.handY+dy*f+ny*n];
  const poly=[at(.09,0),at(.16,-4),at(.72,-7),at(.96,-3),at(1,0),at(.96,3),at(.72,7),at(.16,4)];
  ctx.fillStyle='#cfdb4c';ctx.strokeStyle='#66752d';ctx.lineWidth=.9;
  ctx.beginPath();ctx.moveTo(...poly[0]);for(const v of poly.slice(1))ctx.lineTo(...v);ctx.closePath();ctx.fill();ctx.stroke();
  strokeSeg(...at(1,0),...at(1.06,0),'#d2dce5',2.2);
  ctx.save();ctx.translate(p.handleX,p.handleY);ctx.rotate(Math.atan2(p.handleY-p.handY,p.handleX-p.handX));
  ctx.strokeStyle='#26323e';ctx.lineWidth=4.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(14,-11,19,8,7,14);ctx.stroke();ctx.restore();
  // hand over the shaft
  ctx.fillStyle='#edc9a9';ctx.strokeStyle='#b18b75';ctx.lineWidth=.9;ctx.beginPath();
  const shaftAngle=Math.atan2(p.tipY-p.handleY,p.tipX-p.handleX);
  ctx.ellipse(p.handX,p.handY,5.8,4.5,-shaftAngle,0,TAU);ctx.fill();ctx.stroke();
  if(p.glow){
   const bob=Math.sin(t*16)*2;
   const g=ctx.createRadialGradient(p.targetX,p.targetY,3,p.targetX,p.targetY,30);g.addColorStop(0,'#fb71857a');g.addColorStop(1,'#fb718500');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.targetX,p.targetY,30,0,TAU);ctx.fill();
   ctx.fillStyle='#fb7185';ctx.beginPath();ctx.moveTo(p.targetX,p.targetY-23+bob);ctx.lineTo(p.targetX-10,p.targetY-38+bob);ctx.lineTo(p.targetX+10,p.targetY-38+bob);ctx.closePath();ctx.fill();
   ctx.font='900 13px sans-serif';ctx.textAlign='center';ctx.fillStyle='#161b27';ctx.fillText('!',p.targetX,p.targetY-27+bob);
  }
 }else{
  // broken short rear stub plus forward hook remnant
  strokeSeg(p.handX+dir*7,p.handY-3,p.handleX,p.handleY,'#c4cad2',3);
  ctx.save();ctx.translate(p.handleX,p.handleY);ctx.rotate(Math.atan2(p.handleY-p.handY,p.handleX-p.handX));
  ctx.strokeStyle='#18202b';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(14,-11,19,8,7,14);ctx.stroke();ctx.restore();
 }
 if(mode==='demo'){
  ctx.save();ctx.textAlign='center';ctx.font='800 12px sans-serif';
  ctx.fillStyle='#bcefc5';ctx.fillText('ここを折る',p.targetX,Math.min(p.targetY-42,ground-72));
  ctx.fillStyle='#5eead4';ctx.fillText('手の軌道',Math.max(32,p.handX-24),Math.max(28,p.handY-24));
  ctx.fillStyle='#ffb76a';ctx.fillText('歩く方向 '+(dir===1?'→':'←'),x,ground+36);
  ctx.restore();
 }
}
function drawEffects(){for(const e of effects){ctx.globalAlpha=Math.max(0,e.life/.75);ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,TAU);ctx.fill();}ctx.globalAlpha=1;
 for(const t of texts){ctx.save();ctx.globalAlpha=t.life/.8;ctx.font='900 20px "Hiragino Sans",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#121822';ctx.strokeText(t.label,t.x,t.y-18);ctx.fillStyle=t.color;ctx.fillText(t.label,t.x,t.y-18);ctx.restore();}
 for(const s of stomps){let off;if(s.age<.13){const a=s.age/.13;off=-105*(1-a*a);}else if(s.age<.25)off=0;else{const a=Math.min(1,(s.age-.25)/.19);off=-105*a*a;}ctx.save();ctx.translate(s.x,s.y+off);ctx.fillStyle='#f1eee7';ctx.strokeStyle='#161b26';ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(0,0,18,s.age>=.13&&s.age<.25?13:9,-.22,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-8,-3);ctx.lineTo(7,-3);ctx.stroke();ctx.restore();}}
function draw(){ctx.save();if(shake)ctx.translate(rand(-1,1)*shake*18,rand(-1,1)*shake*18);background(elapsed);for(const w of walkers)drawWalker(w,elapsed);drawEffects();ctx.restore();}
function loop(ts){if(mode!=='play'&&mode!=='demo')return;const dt=Math.min(.045,Math.max(0,(ts-last)/1000))*(slow?.5:1);last=ts;update(dt);draw();if(mode==='play'||mode==='demo')raf=requestAnimationFrame(loop);}
// Opt-in regression-test seam. Ordinary gameplay does not expose these helpers.
// The test runner evaluates this SAME inline script with location.search='?test=1'.
if(new URLSearchParams(window.location.search).has('test')){
 window.__GYAKUGASA_TEST__=Object.freeze({
  poseAt({x=260,dir=1,phase=0,broken=false}={}){
   return pose({x,dir,phase,broken},phase);
  },
  legsAt({x=260,dir=1,phase=0}={}){
   const p=pose({x,dir,phase,broken:false},phase);
   return legEndpoints(p,x,dir);
  },
  scenario({gameMode='play',x=260,dir=1,phase=0,remainingSeconds=60,
            initialScore=0,initialCombo=0,gameElapsed=0}={}){
   if(gameMode!=='play'&&gameMode!=='demo')throw new Error('Invalid test mode');
   reset(gameMode);
   score=initialScore;combo=initialCombo;remaining=remainingSeconds;elapsed=gameElapsed;
   walkers=[Object.assign(makeWalker(x,dir),{
     x,dir,phase,vx:0,stumble:0,stumbleIn:999,broken:false,
     prevTip:null,trail:[]
   })];
   spawnIn=999999;
   hud();
   return pose(walkers[0]);
  },
  replaceWalker({x=260,dir=1,phase=0,broken=false,vx=0}={}){
   walkers=[Object.assign(makeWalker(x,dir),{
     x,dir,phase,broken,vx,stumble:0,stumbleIn:999,
     prevTip:null,trail:[]
   })];
   return pose(walkers[0]);
  },
  setSpawnDelay(ms){spawnIn=ms;},
  soundState(){return {enabled:soundEnabled,events:[...soundEvents]};},
  soundToggle(on){setSound(on);},
  tapAt(x,y){tap(x,y);},
  tick(seconds){update(seconds);},
  render(){draw();},
  state(){
   return {
    mode,score,combo,remaining,elapsed,spawnIn,
    walkerCount:walkers.length,
    walkers:walkers.map(w=>({x:w.x,dir:w.dir,phase:w.phase,
      broken:w.broken,alive:w.alive,position:pose(w)})),
    stompCount:stomps.length,
    hud:{score:$('score').textContent,combo:$('combo').textContent,
      clock:$('clock').textContent},
    startVisible:$('start').style.display!=='none',
    endVisible:$('end').style.display==='flex'
   };
  }
 });
}
soundStatus();
// Screen remains quiet until the user chooses demo or timed play.
background(0);
})();
